<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버스 노선도 제작기</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
    }

    header{
      background:#1976d2;
      color:white;
      padding:15px;
      font-size:24px;
      font-weight:bold;
      text-align:center;
    }

    .container{
      max-width:1000px;
      margin:20px auto;
      display:flex;
      gap:20px;
      padding:10px;
    }

    .left{
      width:300px;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    .right{
      flex:1;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:10px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      background:#1976d2;
      color:white;
      border:none;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;
    }

    #preview{
      margin-top:30px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>
🚌 버스 노선도 제작기
</header>

<div class="container">

<div class="left">
<input id="route" placeholder="노선번호">

<input id="start" placeholder="기점">

<input id="end" placeholder="종점">

<button onclick="makeRoute()">
노선도 만들기
</button>
</div>

<div class="right">

<h2>미리보기</h2>

<div id="preview">
노선을 입력하세요.
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
